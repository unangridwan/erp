name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp
      # Hanya dipakai test rate limiter Redis; test e2e lain memakai pembatas memori.
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Jalankan API hasil build (tsc + decorator metadata) untuk menangkap error injeksi yang tidak muncul di vitest.
      - name: Boot check API
        env:
          JWT_SECRET: ci-secret-yang-panjangnya-lebih-dari-32-karakter
          ENCRYPTION_KEY: ci-encryption-key-yang-panjangnya-lebih-dari-32
          MAIL_TRANSPORT: json
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/health && exit 0; sleep 1; done
          cat api.log
          exit 1
