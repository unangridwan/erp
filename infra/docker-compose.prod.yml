# Contoh deployment satu server: `docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build`
# Taruh reverse proxy TLS (Caddy/nginx/load balancer) di depan web (3000) dan api (3001).
name: erp-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    # WAL diarsipkan terus-menerus untuk point-in-time recovery (lihat infra/pitr dan docs/operations.md).
    # Direktori arsip dibuat & diberikan ke user postgres sebelum entrypoint resmi berjalan.
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'mkdir -p /wal-archive && chown postgres:postgres /wal-archive && exec docker-entrypoint.sh "$$@"',
        "--",
      ]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/pitr/archive-wal.sh %p %f
      - -c
      - archive_timeout=${PITR_ARCHIVE_TIMEOUT:-300}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pitr:/pitr:ro
      - ${BACKUP_PATH:-../backups}/wal:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp}"]
      interval: 5s
      retries: 10

  # Migrasi dijalankan sekali setiap deploy sebelum API menyala.
  migrate:
    build: { context: .., target: api }
    command: ["node", "packages/db/dist/bin/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    env_file: ../.env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp}
      TRUST_PROXY: "1"
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL wajib, mis. https://api.erpku.id}
        NEXT_PUBLIC_SENTRY_DSN: ${WEB_SENTRY_DSN:-}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  # Backup harian pg_dump terkompresi dengan retensi (lihat infra/backup/backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-erp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-erp}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_PATH:-../backups}:/backups
    entrypoint: ["/bin/sh", "/scripts/loop.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  # Base backup fisik berkala + retensi WAL untuk PITR. Berbagi jaringan dengan postgres agar koneksi replication
  # lewat 127.0.0.1 diizinkan pg_hba bawaan image.
  pitr:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: "service:postgres"
    environment:
      PGHOST: 127.0.0.1
      PGUSER: ${POSTGRES_USER:-erp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PITR_BASE_DIR: /backups/base
      WAL_ARCHIVE_DIR: /backups/wal
      PITR_BASE_KEEP: ${PITR_BASE_KEEP:-2}
      PITR_BASE_INTERVAL_SECONDS: ${PITR_BASE_INTERVAL_SECONDS:-604800}
    volumes:
      - ./pitr:/pitr:ro
      - ${BACKUP_PATH:-../backups}:/backups
    entrypoint: ["/bin/sh", "/pitr/loop.sh"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
